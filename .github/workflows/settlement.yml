name: settlement

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

concurrency:
  group: settlement
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Seed provider budget
        run: |
          R=$(node -e 'try{const h=require("./web/api/health.json");const v=h.quota&&h.quota.remaining;if(typeof v==="number")process.stdout.write(String(v))}catch{}')
          if [ -n "$R" ]; then echo "PROVIDER_REMAINING=$R" >> "$GITHUB_ENV"; fi

      - name: Live window guard
        id: win
        run: echo "state=$(node scripts/live_window.mjs)" >> "$GITHUB_OUTPUT"

      - name: Refresh results (football-data, no key)
        run: python3 scripts/refresh_pipeline.py --results --fixtures --no-ledger

      - name: Sync ledger
        run: node scripts/sync_ledger.mjs

      # Provider refresh is best-effort: a provider outage must never block
      # La Liga publishing. The snapshot is committed when usable, and the
      # attempt marker is always written so the TTL gate can skip the next run.
      - name: Refresh provider snapshot
        id: providers
        continue-on-error: true
        env:
          COMPETITIONS: "on"
          PROVIDER_REFRESH_TTL_MIN: "30"
        run: |
          mkdir -p data/providers
          node scripts/refresh_providers.mjs

      - name: Verify
        run: |
          node scripts/check_site_data.mjs
          node scripts/real_match_verify.mjs

      - name: Publish snapshot
        env:
          COMPETITIONS: "on"
        run: node scripts/publish_snapshot.mjs

      - name: Live snapshot (window-guarded)
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: node scripts/live_snapshot.mjs

      - name: Checkpoint WAL
        run: sqlite3 data/calibra.db "PRAGMA wal_checkpoint(TRUNCATE);"

      - name: Commit if changed
        run: |
          git config user.name "calibra-bot"
          git config user.email "bot@users.noreply.github.com"
          # La Liga paths always exist, so a failure here is a real error and
          # must surface. Optional paths are guarded by existence tests instead
          # of swallowing the exit code, which would hide a genuine git fault.
          git add -A data/calibra.db web/api web/data
          [ -d data/providers ] && git add -A data/providers
          [ -f web/epl.html ] && git add -A web/epl.html
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: settlement snapshot"
          git pull --rebase --autostash
          git push